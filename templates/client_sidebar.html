<!-- Client Sidebar Component -->
<aside class="w-full lg:w-64 flex-shrink-0 space-y-6">
    <!-- User Summary Card -->
    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700 text-center">
        <img id="dashAvatar" src="{{ user.avatar_url or '/static/default-avatar.png' }}" alt="Avatar" class="w-24 h-24 rounded-full object-cover border-4 border-blue-500 shadow-md mx-auto mb-4" onerror="this.src='/static/default-avatar.png'">
        <h3 class="font-extrabold text-lg text-gray-900 dark:text-white truncate">{{ user.name }}</h3>
        <p class="text-xs text-gray-500 dark:text-gray-400 mb-3 truncate">{{ user.email }}</p>
        <div class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-300">
            Mijoz kabineti
        </div>
    </div>

    <!-- Client Nav Navigation -->
    <nav class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700 p-3 space-y-1">
        <a href="/dashboard" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition {% if active_page == 'dashboard' %}bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 font-bold{% else %}text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-700/50{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span>Dashboard</span>
        </a>
        <a href="/profil" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition {% if active_page == 'profile' %}bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 font-bold{% else %}text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-700/50{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span>Profil</span>
        </a>
        <a href="/buyurtmalarim" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition {% if active_page == 'orders' %}bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 font-bold{% else %}text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-700/50{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
            <span>Buyurtmalarim</span>
        </a>
        <a href="/xizmatlar" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition {% if active_page == 'new_order' %}bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 font-bold{% else %}text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-700/50{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            <span>Yangi buyurtma</span>
        </a>
        <a href="/bildirishnomalar" class="flex items-center justify-between px-4 py-3 rounded-xl text-sm font-semibold transition {% if active_page == 'notifications' %}bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 font-bold{% else %}text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-700/50{% endif %}">
            <div class="flex items-center gap-3">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                <span>Bildirishnomalar</span>
            </div>
            <span id="sideNotifBadge" class="hidden bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">0</span>
        </a>
        <a href="/yordam" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition {% if active_page == 'support' %}bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 font-bold{% else %}text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-700/50{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <span>Yordam</span>
        </a>
        <button onclick="confirmLogout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-red-600 hover:bg-red-50 dark:hover:bg-slate-700/50 transition text-left">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            <span>Chiqish</span>
        </button>
    </nav>
</aside>
