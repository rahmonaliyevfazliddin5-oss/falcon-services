{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex flex-col md:flex-row gap-8">
        
        <!-- Filters Sidebar -->
        <div class="w-full md:w-64 flex-shrink-0">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 transition-colors">
                <h3 class="font-bold text-lg mb-4 text-gray-900" data-i18n="services.filter_title">Filtrlash</h3>
                <form id="filterForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="services.search_label">Qidiruv</label>
                        <input type="text" id="search" name="search" class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm p-2.5 border" placeholder="Xizmat nomi..." data-i18n-placeholder="services.search_placeholder">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="services.category_label">Kategoriya</label>
                        <select id="category_id" name="category_id" class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm p-2.5 border">
                            <option value="" data-i18n="services.all_categories">Barcha kategoriyalar</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1" data-i18n="services.min_price">Min narx</label>
                            <input type="number" id="min_price" name="min_price" class="w-full border-gray-300 rounded-lg shadow-sm p-2 border text-sm" placeholder="0">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1" data-i18n="services.max_price">Max narx</label>
                            <input type="number" id="max_price" name="max_price" class="w-full border-gray-300 rounded-lg shadow-sm p-2 border text-sm" placeholder="Max">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="services.sort_label">Saralash</label>
                        <select id="sort_by" name="sort_by" class="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm p-2.5 border">
                            <option value="newest" data-i18n="services.sort_newest">Yangi qo'shilganlar</option>
                            <option value="price_asc" data-i18n="services.sort_price_asc">Arzonidan qimmatiga</option>
                            <option value="price_desc" data-i18n="services.sort_price_desc">Qimmatidan arzoniga</option>
                        </select>
                    </div>
                    <div class="pt-2 flex gap-2">
                        <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-700 transition shadow-sm" data-i18n="services.btn_search">Izlash</button>
                        <button type="button" id="clearBtn" class="w-full bg-gray-100 text-gray-700 py-2.5 rounded-lg text-sm font-semibold hover:bg-gray-200 transition" data-i18n="services.btn_clear">Tozalash</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Catalog List -->
        <div class="flex-grow">
            <h2 class="text-2xl font-bold mb-6 text-gray-900" data-i18n="services.title">Xizmatlar katalogi</h2>
            
            <div id="loading" class="flex justify-center py-12"><div class="spinner"></div></div>
            
            <div id="emptyState" class="hidden text-center py-12 bg-white rounded-xl border border-gray-100 shadow-sm transition-colors">
                <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <h3 class="mt-2 text-base font-bold text-gray-900" data-i18n="services.empty_title">Ma'lumot topilmadi</h3>
                <p class="mt-1 text-sm text-gray-500" data-i18n="services.empty_desc">Kiritilgan filtrlar bo'yicha hech qanday xizmat topilmadi.</p>
                <div class="mt-6">
                    <button type="button" onclick="clearFilters()" class="inline-flex items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700" data-i18n="services.btn_clear">Filtrlarni tozalash</button>
                </div>
            </div>

            <div id="servicesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
                <!-- Populated by JS -->
            </div>

            <!-- Pagination -->
            <div id="pagination" class="mt-8 flex justify-center gap-2 hidden">
                <!-- Buttons populated by JS -->
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentPage = 1;
    let cachedServicesData = null;
    let rawCategories = [];

    async function loadCategories() {
        const res = await fetch(`${API_URL}/categories`);
        if (res.ok) {
            rawCategories = await res.json();
            renderCategoriesDropdown();
            restoreFiltersFromUrl();
        }
    }

    function renderCategoriesDropdown() {
        const select = document.getElementById('category_id');
        const currentVal = select.value;
        const allCatsText = t('services.all_categories');
        
        select.innerHTML = `<option value="">${allCatsText}</option>`;
        rawCategories.forEach(c => {
            const localizedCatName = localizeCategory(c.name);
            select.innerHTML += `<option value="${c.id}">${localizedCatName}</option>`;
        });
        if (currentVal) select.value = currentVal;
    }

    function restoreFiltersFromUrl() {
        const params = new URLSearchParams(window.location.search);
        if(params.has('search')) document.getElementById('search').value = params.get('search');
        if(params.has('category_id')) document.getElementById('category_id').value = params.get('category_id');
        if(params.has('min_price')) document.getElementById('min_price').value = params.get('min_price');
        if(params.has('max_price')) document.getElementById('max_price').value = params.get('max_price');
        if(params.has('sort_by')) document.getElementById('sort_by').value = params.get('sort_by');
        if(params.has('page')) currentPage = parseInt(params.get('page'));
        
        fetchServices();
    }

    async function fetchServices() {
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('servicesGrid').classList.add('hidden');
        document.getElementById('emptyState').classList.add('hidden');
        document.getElementById('pagination').classList.add('hidden');

        const params = new URLSearchParams();
        const search = document.getElementById('search').value;
        const category_id = document.getElementById('category_id').value;
        const min_price = document.getElementById('min_price').value;
        const max_price = document.getElementById('max_price').value;
        const sort_by = document.getElementById('sort_by').value;

        if (search) params.append('search', search);
        if (category_id) params.append('category_id', category_id);
        if (min_price) params.append('min_price', min_price);
        if (max_price) params.append('max_price', max_price);
        if (sort_by) params.append('sort_by', sort_by);
        params.append('page', currentPage);
        params.append('limit', 9);

        // Update URL
        const newUrl = `${window.location.pathname}?${params.toString()}`;
        window.history.pushState({path: newUrl}, '', newUrl);

        try {
            const res = await fetch(`${API_URL}/services?${params.toString()}`);
            if (res.ok) {
                cachedServicesData = await res.json();
                renderServices(cachedServicesData);
                renderPagination(cachedServicesData);
            }
        } catch (e) {
            showToast("Xatolik yuz berdi", "error");
        }
    }

    function renderServices(data) {
        const loading = document.getElementById('loading');
        const grid = document.getElementById('servicesGrid');
        const empty = document.getElementById('emptyState');
        
        loading.classList.add('hidden');
        
        if (!data || data.items.length === 0) {
            empty.classList.remove('hidden');
            return;
        }

        grid.classList.remove('hidden');
        const workingLinkText = t('services.working_link');

        grid.innerHTML = data.items.map(raw => {
            const s = localizeService(raw);
            const daysText = formatDays(s.delivery_days);

            return `
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-lg transition cursor-pointer flex flex-col group" onclick="window.location.href='/services/${s.id}'">
                    <div class="relative overflow-hidden h-48 bg-gray-100">
                        <img src="${s.image_url}" alt="${s.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://placehold.co/600x400/2563eb/ffffff?text=Falcon+Services'">
                    </div>
                    <div class="p-5 flex-grow flex flex-col">
                        <h3 class="text-base sm:text-lg font-bold text-gray-900 group-hover:text-blue-600 transition line-clamp-1">${s.title}</h3>
                        <p class="text-xs sm:text-sm text-gray-500 mt-2 line-clamp-2">${s.description}</p>
                        ${s.working_link ? `
                            <div class="mt-3">
                                <a href="${s.working_link}" target="_blank" onclick="event.stopPropagation()" class="inline-flex items-center gap-1 text-xs text-blue-600 dark:text-blue-400 font-bold hover:underline bg-blue-50 dark:bg-slate-700/80 px-2.5 py-1 rounded-md">
                                    ${workingLinkText}
                                </a>
                            </div>
                        ` : ''}
                        <div class="mt-auto pt-4 flex justify-between items-center border-t border-gray-100 dark:border-slate-700">
                            <span class="text-base sm:text-lg font-extrabold text-blue-600 dark:text-blue-400">${s.price.toLocaleString()} UZS</span>
                            <span class="text-xs text-gray-500 font-medium">${daysText}</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderPagination(data) {
        const pag = document.getElementById('pagination');
        if (!data || data.pages <= 1) {
            pag.classList.add('hidden');
            return;
        }
        pag.classList.remove('hidden');
        
        let html = '';
        for (let i = 1; i <= data.pages; i++) {
            const activeClass = i === data.page ? 'bg-blue-600 text-white shadow-sm' : 'bg-white text-gray-700 hover:bg-gray-50';
            html += `<button onclick="changePage(${i})" class="px-3.5 py-1.5 border border-gray-200 rounded-lg text-sm font-semibold transition ${activeClass}">${i}</button>`;
        }
        pag.innerHTML = html;
    }

    function changePage(page) {
        currentPage = page;
        fetchServices();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function clearFilters() {
        document.getElementById('filterForm').reset();
        currentPage = 1;
        fetchServices();
    }

    document.getElementById('filterForm').addEventListener('submit', (e) => {
        e.preventDefault();
        currentPage = 1;
        fetchServices();
    });
    
    document.getElementById('clearBtn').addEventListener('click', clearFilters);

    document.addEventListener('DOMContentLoaded', loadCategories);

    // Dynamic language change listener
    window.addEventListener('languageChanged', () => {
        renderCategoriesDropdown();
        if (cachedServicesData) {
            renderServices(cachedServicesData);
        }
    });

    // Handle browser back/forward buttons
    window.addEventListener('popstate', restoreFiltersFromUrl);
</script>
{% endblock %}
