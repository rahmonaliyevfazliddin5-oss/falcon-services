{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <div id="loading" class="flex justify-center py-12"><div class="spinner"></div></div>
    
    <div id="serviceContent" class="hidden">
        <!-- Breadcrumb & Title -->
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900" id="s-title"></h1>
            <p class="text-sm text-gray-500 mt-2">Kategoriya: <span id="s-category" class="font-medium"></span></p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left: Details -->
            <div class="lg:col-span-2 space-y-6">
                <img id="s-img" src="" alt="" class="w-full h-64 sm:h-96 object-cover rounded-xl shadow-sm">
                
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="text-xl font-bold mb-4">Xizmat tavsifi</h3>
                    <p class="text-gray-600 whitespace-pre-line" id="s-desc"></p>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h3 class="text-xl font-bold mb-4">Tarkibiga kiruvchi ishlar</h3>
                    <ul class="space-y-3" id="s-includes">
                    </ul>
                </div>
            </div>

            <!-- Right: Order Form -->
            <div>
                <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100 sticky top-4">
                    <div class="flex items-end justify-between mb-6 border-b pb-4">
                        <div>
                            <p class="text-sm text-gray-500">Narxi</p>
                            <p class="text-2xl font-bold text-blue-600" id="s-price"></p>
                        </div>
                        <div class="text-right">
                            <p class="text-sm text-gray-500">Bajarish muddati</p>
                            <p class="text-lg font-bold text-gray-900"><span id="s-days"></span> kun</p>
                        </div>
                    </div>

                    <form id="orderForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Loyiha nomi</label>
                            <input type="text" id="project_name" required class="mt-1 w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 flex justify-between">
                                Texnik topshiriq 
                                <span id="tt-counter" class="text-xs text-gray-400">0/50</span>
                            </label>
                            <textarea id="technical_task" rows="4" required class="mt-1 w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Loyiha haqida batafsil yozing..."></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Istalgan yakunlash sanasi</label>
                            <input type="date" id="desired_deadline" required class="mt-1 w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Aloqa telefoni</label>
                            <input type="tel" id="contact_phone" required class="mt-1 w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="+998901234567">
                        </div>
                        
                        <button type="submit" id="orderBtn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
                            Buyurtma berish
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Related Services -->
        <div class="mt-16">
            <h2 class="text-2xl font-bold mb-6">Tegishli boshqa xizmatlar</h2>
            <div id="relatedGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- JS populated -->
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const serviceId = {{ service_id }};
    let minDeadlineStr = '';
    let categoryName = 'Kategoriya';

    document.getElementById('technical_task').addEventListener('input', function(e) {
        const text = e.target.value.replace(/\s/g, "");
        const counter = document.getElementById('tt-counter');
        counter.innerText = `${text.length}/50`;
        if(text.length < 50) {
            counter.classList.add('text-red-500');
            counter.classList.remove('text-green-500');
        } else {
            counter.classList.remove('text-red-500');
            counter.classList.add('text-green-500');
        }
    });

    async function loadService() {
        try {
            // we need category name, let's fetch cats first quickly or just show ID. The endpoint doesn't return category name, so we fetch cats.
            const catRes = await fetch(`${API_URL}/categories`);
            let categories = [];
            if(catRes.ok) categories = await catRes.json();

            const res = await fetch(`${API_URL}/services/${serviceId}`);
            if (res.ok) {
                const s = await res.json();
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('serviceContent').classList.remove('hidden');

                document.getElementById('s-title').innerText = s.title;
                const cat = categories.find(c => c.id === s.category_id);
                document.getElementById('s-category').innerText = cat ? cat.name : '';
                document.getElementById('s-img').src = s.image_url;
                document.getElementById('s-desc').innerText = s.description;
                document.getElementById('s-price').innerText = `${s.price.toLocaleString()} UZS`;
                document.getElementById('s-days').innerText = s.delivery_days;

                if (s.included_items) {
                    const items = s.included_items.split(',').map(i => i.trim());
                    document.getElementById('s-includes').innerHTML = items.map(i => `
                        <li class="flex items-start">
                            <svg class="h-5 w-5 text-green-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                            <span class="text-gray-700">${i}</span>
                        </li>
                    `).join('');
                }

                // Setup Date logic
                const minDate = new Date();
                minDate.setDate(minDate.getDate() + s.delivery_days);
                minDeadlineStr = minDate.toISOString().split('T')[0];
                document.getElementById('desired_deadline').min = minDeadlineStr;
                document.getElementById('desired_deadline').value = minDeadlineStr;

                // Related
                const rGrid = document.getElementById('relatedGrid');
                rGrid.innerHTML = s.related_services.map(r => `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md cursor-pointer flex flex-col" onclick="window.location.href='/services/${r.id}'">
                        <img src="${r.image_url}" class="w-full h-32 object-cover">
                        <div class="p-4 flex-grow flex flex-col">
                            <h3 class="font-bold text-sm text-gray-900 line-clamp-1">${r.title}</h3>
                            <p class="text-blue-600 font-bold mt-auto pt-2">${r.price.toLocaleString()} UZS</p>
                        </div>
                    </div>
                `).join('');

            } else {
                showToast("Xizmat topilmadi", "error");
            }
        } catch (e) {
            console.error(e);
        }
    }

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!getToken()) {
            window.location.href = `/login?next=/services/${serviceId}`;
            return;
        }

        const tt = document.getElementById('technical_task').value;
        if(tt.replace(/\s/g, "").length < 50) {
            showToast("Texnik topshiriq kamida 50 ta belgidan iborat bo'lishi kerak", "error");
            return;
        }

        const btn = document.getElementById('orderBtn');
        btn.disabled = true;
        btn.innerText = "Yuborilmoqda...";
        btn.classList.add('opacity-75');

        const payload = {
            service_id: serviceId,
            project_name: document.getElementById('project_name').value,
            technical_task: tt,
            desired_deadline: document.getElementById('desired_deadline').value,
            contact_phone: document.getElementById('contact_phone').value
        };

        try {
            const res = await fetchWithAuth(`${API_URL}/orders`, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            
            const data = await res.json();
            
            if (res.ok) {
                showToast("Buyurtma muvaffaqiyatli yaratildi!");
                setTimeout(() => window.location.href = '/profile', 1500);
            } else {
                showToast(data.detail || "Xatolik yuz berdi", "error");
                btn.disabled = false;
                btn.innerText = "Buyurtma berish";
                btn.classList.remove('opacity-75');
            }
        } catch(e) {
            showToast("Tarmoq xatosi", "error");
            btn.disabled = false;
            btn.innerText = "Buyurtma berish";
            btn.classList.remove('opacity-75');
        }
    });

    document.addEventListener('DOMContentLoaded', loadService);
</script>
{% endblock %}
