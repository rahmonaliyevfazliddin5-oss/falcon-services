{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <div id="loading" class="flex justify-center py-12"><div class="spinner"></div></div>
    
    <div id="serviceContent" class="hidden">
        <!-- Breadcrumb & Title -->
        <div class="mb-8">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900" id="s-title"></h1>
            <p class="text-sm text-gray-500 mt-2"><span data-i18n="services.category_label">Kategoriya</span>: <span id="s-category" class="font-bold text-blue-600 dark:text-blue-400"></span></p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left: Details -->
            <div class="lg:col-span-2 space-y-6">
                <img id="s-img" src="" alt="" class="w-full h-64 sm:h-96 object-cover rounded-2xl shadow-sm" onerror="this.src='https://placehold.co/600x400/2563eb/ffffff?text=Falcon+Services'">
                
                <div id="workingLinkBox" class="hidden bg-blue-50 dark:bg-slate-800 p-4 rounded-2xl border border-blue-200 dark:border-slate-700 flex items-center justify-between transition-colors">
                    <div>
                        <p class="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-wider" data-i18n="services.working_link_badge">Faol Ishchi Havola / Demo</p>
                        <p class="text-xs text-gray-600 dark:text-gray-300 mt-0.5" data-i18n="services.working_link_desc">Ushbu xizmatning amaldagi faol loyiha havolasi</p>
                    </div>
                    <a id="s-link" href="#" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded-lg shadow transition flex items-center gap-1" data-i18n="services.open_link">
                        Havolani ochish ↗
                    </a>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 transition-colors">
                    <h3 class="text-lg sm:text-xl font-bold mb-4 text-gray-900" data-i18n="services.details">Xizmat tavsifi</h3>
                    <p class="text-gray-600 leading-relaxed whitespace-pre-line text-sm sm:text-base" id="s-desc"></p>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 transition-colors">
                    <h3 class="text-lg sm:text-xl font-bold mb-4 text-gray-900" data-i18n="services.includes_title">Tarkibiga kiruvchi ishlar</h3>
                    <ul class="space-y-3" id="s-includes">
                    </ul>
                </div>
            </div>

            <!-- Right: Order Form -->
            <div>
                <div class="bg-white p-6 rounded-2xl shadow-lg border border-gray-100 sticky top-20 transition-colors">
                    <div class="flex items-end justify-between mb-6 border-b pb-4 border-gray-100 dark:border-slate-700">
                        <div>
                            <p class="text-xs font-medium text-gray-500 uppercase tracking-wider" data-i18n="services.price">Narxi</p>
                            <p class="text-2xl font-extrabold text-blue-600 dark:text-blue-400 mt-1" id="s-price"></p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-medium text-gray-500 uppercase tracking-wider" data-i18n="services.delivery">Bajarish muddati</p>
                            <p class="text-lg font-bold text-gray-900 mt-1" id="s-days"></p>
                        </div>
                    </div>

                    <h3 class="font-bold text-lg text-gray-900 mb-4" data-i18n="order.title">Buyurtma berish</h3>

                    <form id="orderForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1" data-i18n="order.project_name">Loyiha nomi</label>
                            <input type="text" id="project_name" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="Onlayn do'kon veb-sayti" data-i18n-placeholder="order.project_placeholder">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1 flex justify-between">
                                <span data-i18n="order.tt_label">Texnik topshiriq</span>
                                <span id="tt-counter" class="text-xs text-gray-400 font-normal">0/50</span>
                            </label>
                            <textarea id="technical_task" rows="4" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="Loyiha haqida batafsil yozing..." data-i18n-placeholder="order.tt_placeholder"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1" data-i18n="order.deadline_label">Istalgan yakunlash sanasi</label>
                            <input type="date" id="desired_deadline" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1" data-i18n="order.phone_label">Aloqa telefoni</label>
                            <input type="tel" id="contact_phone" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500 focus:border-blue-500" placeholder="+998998967440">
                        </div>
                        
                        <button type="submit" id="orderBtn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-md" data-i18n="order.submit">
                            Buyurtmani tasdiqlash
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const serviceId = {{ service_id }};
    let rawService = null;
    let rawCategories = [];

    document.getElementById('technical_task').addEventListener('input', function(e) {
        const text = e.target.value.replace(/\s/g, "");
        const counter = document.getElementById('tt-counter');
        counter.innerText = `${text.length}/50`;
        if(text.length < 50) {
            counter.classList.add('text-red-500');
            counter.classList.remove('text-green-500');
        } else {
            counter.classList.remove('text-red-500');
            counter.classList.add('text-green-500');
        }
    });

    async function loadService() {
        try {
            const catRes = await fetch(`${API_URL}/categories`);
            if(catRes.ok) rawCategories = await catRes.json();

            const res = await fetch(`${API_URL}/services/${serviceId}`);
            if (res.ok) {
                rawService = await res.json();
                renderServiceDetails();
            }
        } catch (e) {
            console.error("Xatolik", e);
        }
    }

    function renderServiceDetails() {
        if (!rawService) return;
        const s = localizeService(rawService);
        
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('serviceContent').classList.remove('hidden');

        document.getElementById('s-title').innerText = s.title;
        const cat = rawCategories.find(c => c.id === s.category_id);
        document.getElementById('s-category').innerText = cat ? localizeCategory(cat.name) : '';
        document.getElementById('s-img').src = s.image_url;
        document.getElementById('s-desc').innerText = s.description;
        document.getElementById('s-price').innerText = `${s.price.toLocaleString()} UZS`;
        document.getElementById('s-days').innerText = formatDays(s.delivery_days);

        if (s.working_link) {
            document.getElementById('workingLinkBox').classList.remove('hidden');
            document.getElementById('s-link').href = s.working_link;
        } else {
            document.getElementById('workingLinkBox').classList.add('hidden');
        }

        if (s.included_items) {
            const items = s.included_items.split(',').map(i => i.trim());
            document.getElementById('s-includes').innerHTML = items.map(i => `
                <li class="flex items-start">
                    <svg class="h-5 w-5 text-green-500 mr-2 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    <span class="text-gray-700 text-sm sm:text-base">${i}</span>
                </li>
            `).join('');
        }

        // Set min deadline to tomorrow
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + (s.delivery_days || 1));
        document.getElementById('desired_deadline').min = tomorrow.toISOString().split('T')[0];
    }

    document.getElementById('orderForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const token = getToken();
        if (!token) {
            showToast("Buyurtma berish uchun tizimga kiring", "error");
            setTimeout(() => {
                window.location.href = `/login?next=${encodeURIComponent(window.location.pathname)}`;
            }, 1000);
            return;
        }

        const taskText = document.getElementById('technical_task').value;
        if (taskText.replace(/\s/g, "").length < 50) {
            showToast("Texnik topshiriq kamida 50 ta belgidan iborat bo'lishi kerak", "error");
            return;
        }

        const payload = {
            service_id: serviceId,
            project_name: document.getElementById('project_name').value,
            technical_task: taskText,
            desired_deadline: document.getElementById('desired_deadline').value,
            contact_phone: document.getElementById('contact_phone').value
        };

        const btn = document.getElementById('orderBtn');
        btn.disabled = true;
        btn.innerText = "Yuborilmoqda...";

        try {
            const res = await fetchWithAuth(`${API_URL}/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                const data = await res.json();
                showToast("Buyurtmangiz muvaffaqiyatli qabul qilindi!");
                setTimeout(() => {
                    window.location.href = '/profile';
                }, 1000);
            } else {
                const err = await res.json();
                showToast(err.detail || "Xatolik yuz berdi", "error");
                btn.disabled = false;
                btn.innerText = t('order.submit');
            }
        } catch (e) {
            showToast("Server bilan aloqa uzildi", "error");
            btn.disabled = false;
            btn.innerText = t('order.submit');
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        loadService();
        
        // Auto fill contact phone if logged in
        if (getToken()) {
            fetchWithAuth(`${API_URL}/auth/me`).then(r => r.json()).then(u => {
                if (u && u.phone) document.getElementById('contact_phone').value = u.phone;
            }).catch(()=>{});
        }
    });

    window.addEventListener('languageChanged', renderServiceDetails);
</script>
{% endblock %}
