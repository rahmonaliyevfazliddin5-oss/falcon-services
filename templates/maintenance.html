<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saytda sozlash ishlari olib borilmoqda - Falcon Services</title>
    <link rel="icon" type="image/png" href="/static/favicon.png?v=2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .pulse-dot {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .4; transform: scale(0.95); }
        }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 select-none">

    <!-- Responsive Maintenance Container (Mobile, Tablet, Desktop) -->
    <main class="w-full max-w-4xl mx-auto flex flex-col items-center justify-center text-center">
        
        <!-- Live status badge -->
        <div class="mb-3 sm:mb-6 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-blue-50 border border-blue-100 text-blue-700 text-xs sm:text-sm font-semibold shadow-sm">
            <span class="w-2 h-2 rounded-full bg-blue-600 pulse-dot"></span>
            <span>Texnik yangilanish va optimizatsiya jarayoni</span>
        </div>

        <!-- Fullscreen Responsive Image -->
        <div class="w-full flex items-center justify-center px-2 sm:px-4">
            <img 
                src="/static/maintenance.png" 
                alt="Falcon Services - Veb-saytda tozalash hamda sozlash ishlari olib borilyabdi" 
                class="w-full max-w-[320px] sm:max-w-[540px] md:max-w-[720px] lg:max-w-[880px] h-auto object-contain drop-shadow-sm transition-all duration-300"
                loading="eager"
            >
        </div>

        <!-- Automatic Reload Indicator -->
        <div class="mt-6 sm:mt-8 flex items-center gap-2 text-xs sm:text-sm text-gray-400">
            <svg class="w-4 h-4 animate-spin text-blue-500" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <span>Sozlash yakunlangach sahifa avtomatik yangilanadi...</span>
        </div>
    </main>

    <!-- Auto-reload Script when Maintenance Mode is switched to False -->
    <script>
        async function checkMaintenanceStatus() {
            try {
                const res = await fetch('/api/maintenance/status');
                if (res.ok) {
                    const data = await res.json();
                    if (!data.maintenance) {
                        window.location.reload();
                    }
                }
            } catch (e) {
                // Ignore transient network errors
            }
        }
        // Poll status every 4 seconds
        setInterval(checkMaintenanceStatus, 4000);
    </script>
</body>
</html>
