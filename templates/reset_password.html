{% extends "base.html" %}

{% block title %}Yangi parol o'rnatish | Falcon Services{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700 transition-colors">
        <div>
            <div class="w-12 h-12 rounded-2xl bg-green-50 dark:bg-green-900/30 text-green-600 dark:text-green-400 flex items-center justify-center mx-auto mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            </div>
            <h2 class="text-center text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">
                Yangi parol o'rnatish
            </h2>
            <p class="text-xs text-center text-gray-500 dark:text-gray-400 mt-2">
                Iltimos, xavfsiz va esda qolarli yangi parol kiriting.
            </p>
        </div>

        <div id="statusBox" class="hidden rounded-xl p-4 text-xs font-medium border"></div>

        <form id="resetForm" onsubmit="handleResetPassword(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1">Tiklash kodi / Token</label>
                <input id="token" type="text" required value="{{ token }}" placeholder="Xavfsizlik kodi" class="w-full border border-gray-300 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-lg p-2.5 text-sm focus:ring-blue-500 focus:border-blue-500 font-mono text-xs">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1">Yangi parol</label>
                <input id="newPassword" type="password" required minlength="6" placeholder="••••••••" class="w-full border border-gray-300 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-lg p-2.5 text-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1">Yangi parolni tasdiqlash</label>
                <input id="confirmPassword" type="password" required minlength="6" placeholder="••••••••" class="w-full border border-gray-300 dark:border-slate-600 dark:bg-slate-900 dark:text-white rounded-lg p-2.5 text-sm focus:ring-blue-500 focus:border-blue-500">
            </div>

            <button type="submit" id="submitBtn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none transition">
                Parolni yangilash & Kirish
            </button>

            <div class="text-sm text-center text-gray-500 dark:text-gray-400 pt-2 border-t border-gray-100 dark:border-slate-700">
                <a href="/kirish" class="font-bold text-blue-600 hover:text-blue-500">Kirish sahifasiga qaytish</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function handleResetPassword(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const token = document.getElementById('token').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const statusBox = document.getElementById('statusBox');

        if (newPassword !== confirmPassword) {
            statusBox.className = "rounded-xl p-4 text-xs font-medium bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-800";
            statusBox.innerHTML = "Kiritilgan parollar bir-biriga mos kelmadi!";
            statusBox.classList.remove('hidden');
            return;
        }

        setButtonLoading(btn, "Yangilanmoqda...");
        statusBox.classList.add('hidden');

        try {
            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, new_password: newPassword })
            });

            const data = await res.json();
            resetButton(btn);

            if (res.ok) {
                statusBox.className = "rounded-xl p-4 text-xs font-medium bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-300 border border-green-200 dark:border-green-800";
                statusBox.innerHTML = `<strong>Muvaffaqiyatli!</strong> ${data.message} Tez orada kirish sahifasiga yo'naltirilasiz...`;
                statusBox.classList.remove('hidden');
                showToast("Parol yangilandi!", "success");

                setTimeout(() => {
                    window.location.href = '/kirish';
                }, 1800);
            } else {
                statusBox.className = "rounded-xl p-4 text-xs font-medium bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-800";
                statusBox.innerHTML = `<strong>Xatolik:</strong> ${data.detail || "Xatolik yuz berdi"}`;
                statusBox.classList.remove('hidden');
            }
        } catch (err) {
            resetButton(btn);
            statusBox.className = "rounded-xl p-4 text-xs font-medium bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-300 border border-red-200 dark:border-red-800";
            statusBox.innerHTML = "Tarmoq xatosi. Qaytadan urinib ko'ring.";
            statusBox.classList.remove('hidden');
        }
    }
</script>
{% endblock %}
