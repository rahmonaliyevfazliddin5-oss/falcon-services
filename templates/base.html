<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Falcon Services{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/static/favicon.png?v=2">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .spinner {
            border: 3px solid rgba(0,0,0,0.1);
            width: 24px; height: 24px; border-radius: 50%;
            border-left-color: #3b82f6;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .toast { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    
    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex-shrink-0 flex items-center gap-2">
                        <img src="/static/logo.png" alt="Falcon Logo" class="h-10 w-10 rounded-full object-cover shadow-sm">
                        <span class="font-bold text-xl text-gray-900 tracking-tight">Falcon</span>
                    </a>
                    <div class="hidden sm:ml-8 sm:flex sm:space-x-8">
                        <a href="/" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Bosh sahifa</a>
                        <a href="/services" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">Xizmatlar katalogi</a>
                    </div>
                </div>
                <div class="flex items-center gap-4" id="nav-auth-section">
                    <!-- JS will populate this -->
                </div>
            </div>
        </div>
    </nav>

    <div id="toast-container"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
            <div class="md:flex md:items-center md:justify-between">
                <div class="flex justify-center md:justify-start space-x-6 md:order-2">
                    <p class="text-gray-400 text-sm">Aloqa: +998 90 123 45 67 | info@falcon.uz</p>
                </div>
                <div class="mt-8 md:mt-0 md:order-1">
                    <p class="text-center text-sm text-gray-500">&copy; 2026 Falcon Services. Barcha huquqlar himoyalangan.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-xl max-w-sm w-full mx-4">
            <h3 class="text-lg font-bold text-gray-900 mb-2" id="confirmTitle">Tasdiqlang</h3>
            <p class="text-sm text-gray-500 mb-6" id="confirmText">Haqiqatan ham bu amalni bajarasizmi?</p>
            <div class="flex justify-end gap-3">
                <button id="confirmCancel" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg">Bekor qilish</button>
                <button id="confirmOk" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg">Tasdiqlash</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        // Auth Utilities
        function getToken() { return localStorage.getItem('token'); }
        function setToken(token) { localStorage.setItem('token', token); }
        function removeToken() { localStorage.removeItem('token'); }

        async function fetchWithAuth(url, options = {}) {
            const token = getToken();
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            
            const response = await fetch(url, { ...options, headers });
            if (response.status === 401) {
                removeToken();
                if(window.location.pathname !== '/login' && window.location.pathname !== '/register' && window.location.pathname !== '/') {
                    window.location.href = '/login?next=' + window.location.pathname;
                }
            }
            return response;
        }

        // Toast Notification
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const color = type === 'error' ? 'bg-red-500' : 'bg-green-500';
            toast.className = `${color} text-white px-4 py-3 rounded-lg shadow-lg mb-3 toast flex items-center justify-between`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Confirm Modal Helper
        function confirmAction(title, text, callback) {
            const modal = document.getElementById('confirmModal');
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmText').innerText = text;
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const btnCancel = document.getElementById('confirmCancel');
            const btnOk = document.getElementById('confirmOk');

            const cleanup = () => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                btnCancel.removeEventListener('click', onCancel);
                btnOk.removeEventListener('click', onOk);
            };

            const onCancel = () => cleanup();
            const onOk = () => { cleanup(); callback(); };

            btnCancel.addEventListener('click', onCancel);
            btnOk.addEventListener('click', onOk);
        }

        // Update Navbar based on user state
        async function updateNavbar() {
            const navSection = document.getElementById('nav-auth-section');
            const token = getToken();
            if (!token) {
                navSection.innerHTML = `
                    <a href="/login" class="text-gray-500 hover:text-gray-900 text-sm font-medium">Kirish</a>
                    <a href="/register" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Ro'yxatdan o'tish</a>
                `;
                return;
            }

            try {
                const res = await fetchWithAuth(`${API_URL}/auth/me`);
                if (res.ok) {
                    const user = await res.json();
                    let links = '';
                    if (user.role === 'admin') {
                        links = `<a href="/admin" class="text-gray-500 hover:text-gray-900 text-sm font-medium">Admin Panel</a>`;
                    } else {
                        links = `<a href="/profile" class="text-gray-500 hover:text-gray-900 text-sm font-medium">Mening kabinetim</a>`;
                    }
                    navSection.innerHTML = `
                        ${links}
                        <button onclick="logout()" class="text-red-500 hover:text-red-700 text-sm font-medium ml-4">Chiqish</button>
                    `;
                }
            } catch (e) {
                console.error(e);
            }
        }

        function logout() {
            removeToken();
            window.location.href = '/';
        }

        document.addEventListener('DOMContentLoaded', updateNavbar);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
