<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Falcon Services{% endblock %}</title>
    
    <script>
        // Immediate dark mode initialization to prevent flickering
        if (localStorage.getItem('falcon_theme') === 'dark' || (!('falcon_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b1120',
                        darkCard: '#1e293b',
                        darkBorder: '#334155'
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/static/favicon.png?v=2">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/i18n.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        .spinner {
            border: 3px solid rgba(0,0,0,0.1);
            width: 24px; height: 24px; border-radius: 50%;
            border-left-color: #3b82f6;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .toast { transition: opacity 0.3s ease; }

        /* Dark mode custom overrides for modern glassmorphism */
        .dark body { background-color: #0b1120; color: #f1f5f9; }
        .dark nav { background-color: rgba(15, 23, 42, 0.95) !important; border-color: #1e293b !important; }
        .dark footer { background-color: #0f172a !important; border-color: #1e293b !important; }
        .dark .bg-white { background-color: #1e293b !important; border-color: #334155 !important; color: #f8fafc !important; }
        .dark .text-gray-900 { color: #f8fafc !important; }
        .dark .text-gray-800 { color: #f1f5f9 !important; }
        .dark .text-gray-700 { color: #e2e8f0 !important; }
        .dark .text-gray-600 { color: #cbd5e1 !important; }
        .dark .text-gray-500 { color: #94a3b8 !important; }
        .dark .bg-gray-50 { background-color: #0f172a !important; }
        .dark .bg-gray-100 { background-color: #1e293b !important; }
        .dark .border-gray-200, .dark .border-gray-100 { border-color: #334155 !important; }
        .dark input, .dark select, .dark textarea { 
            background-color: #0f172a !important; 
            color: #f8fafc !important; 
            border-color: #334155 !important; 
        }
        .dark tr:hover { background-color: rgba(51, 65, 85, 0.4) !important; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    
    <!-- Navbar -->
    <nav class="bg-white sticky top-0 z-40 backdrop-blur-md shadow-sm border-b border-gray-100 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex-shrink-0 flex items-center gap-2">
                        <img src="/static/logo.png" alt="Falcon Logo" class="h-10 w-10 rounded-full object-cover shadow-sm border border-blue-400">
                        <span class="font-extrabold text-xl text-gray-900 tracking-tight" data-i18n="nav.brand">Falcon</span>
                    </a>
                    <div class="hidden sm:ml-8 sm:flex sm:space-x-8">
                        <a href="/" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium" data-i18n="nav.home">Bosh sahifa</a>
                        <a href="/services" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium" data-i18n="nav.services">Xizmatlar katalogi</a>
                    </div>
                </div>

                <!-- Right Controls: Language, Theme, Auth -->
                <div class="flex items-center gap-3">
                    <!-- Language Switcher -->
                    <select id="languageSelect" onchange="setLanguage(this.value)" class="bg-gray-100 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 text-gray-700 dark:text-gray-200 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none cursor-pointer">
                        <option value="uz">🇺🇿 UZ</option>
                        <option value="ru">🇷🇺 RU</option>
                        <option value="en">🇬🇧 EN</option>
                    </select>

                    <!-- Theme Toggle Button -->
                    <button onclick="toggleTheme()" id="themeToggleBtn" class="p-1.5 text-gray-500 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-lg transition" title="Mavzuni almashtirish">
                        <span id="themeIcon" class="text-lg">🌙</span>
                    </button>

                    <!-- User / Auth Section -->
                    <div class="flex items-center gap-3 pl-2 border-l border-gray-200 dark:border-slate-700" id="nav-auth-section">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div id="toast-container"></div>

    <!-- Main Content -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-12 transition-colors">
        <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
            <div class="md:flex md:items-center md:justify-between">
                <div class="flex justify-center md:justify-start space-x-6 md:order-2">
                    <p class="text-gray-400 text-sm"><span data-i18n="footer.contact">Aloqa:</span> +998 90 123 45 67 | info@falcon.uz</p>
                </div>
                <div class="mt-8 md:mt-0 md:order-1">
                    <p class="text-center text-sm text-gray-500">&copy; 2026 Falcon Services. <span data-i18n="footer.rights">Barcha huquqlar himoyalangan.</span></p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-xl max-w-sm w-full mx-4 border border-gray-200 dark:border-slate-700">
            <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-2" id="confirmTitle">Tasdiqlang</h3>
            <p class="text-sm text-gray-500 dark:text-gray-300 mb-6" id="confirmText">Haqiqatan ham bu amalni bajarasizmi?</p>
            <div class="flex justify-end gap-3">
                <button id="confirmCancel" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-slate-700 hover:bg-gray-200 dark:hover:bg-slate-600 rounded-lg">Bekor qilish</button>
                <button id="confirmOk" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg">Tasdiqlash</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        // Auth Utilities
        function getToken() { return localStorage.getItem('token'); }
        function setToken(token) { localStorage.setItem('token', token); }
        function removeToken() { localStorage.removeItem('token'); }

        async function fetchWithAuth(url, options = {}) {
            const token = getToken();
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            
            const response = await fetch(url, { ...options, headers });
            if (response.status === 401) {
                removeToken();
                document.cookie = "access_token=; path=/; max-age=0";
                if(window.location.pathname !== '/login' && window.location.pathname !== '/register' && window.location.pathname !== '/') {
                    window.location.href = '/login?next=' + window.location.pathname;
                }
            }
            return response;
        }

        // Dark Mode Functionality
        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('themeIcon');
            if (icon) {
                icon.innerText = isDark ? '☀️' : '🌙';
            }
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('falcon_theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('falcon_theme', 'dark');
            }
            updateThemeIcon();
        }

        // Toast Notification
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const color = type === 'error' ? 'bg-red-500' : 'bg-green-500';
            toast.className = `${color} text-white px-4 py-3 rounded-lg shadow-lg mb-3 toast flex items-center justify-between text-sm font-medium z-50`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Confirm Modal Helper
        function confirmAction(title, text, callback) {
            const modal = document.getElementById('confirmModal');
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmText').innerText = text;
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const btnCancel = document.getElementById('confirmCancel');
            const btnOk = document.getElementById('confirmOk');

            const cleanup = () => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                btnCancel.removeEventListener('click', onCancel);
                btnOk.removeEventListener('click', onOk);
            };

            const onCancel = () => cleanup();
            const onOk = () => { cleanup(); callback(); };

            btnCancel.addEventListener('click', onCancel);
            btnOk.addEventListener('click', onOk);
        }

        // Update Navbar based on user state
        async function updateNavbar() {
            const navSection = document.getElementById('nav-auth-section');
            const token = getToken();
            if (!token) {
                navSection.innerHTML = `
                    <a href="/login" class="text-gray-500 hover:text-gray-900 text-sm font-medium" data-i18n="nav.login">Kirish</a>
                    <a href="/register" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-lg text-sm font-medium transition shadow-sm" data-i18n="nav.register">Ro'yxatdan o'tish</a>
                `;
                setLanguage(getLanguage());
                return;
            }

            try {
                const res = await fetchWithAuth(`${API_URL}/auth/me`);
                if (res.ok) {
                    const user = await res.json();
                    let navLink = '';
                    if (user.role === 'admin') {
                        navLink = `<a href="/admin" class="text-blue-600 dark:text-blue-400 font-bold hover:underline text-sm" data-i18n="nav.admin">Admin Panel</a>`;
                    } else {
                        navLink = `<a href="/profile" class="text-gray-700 dark:text-gray-300 font-medium hover:text-blue-600 text-sm" data-i18n="nav.profile">Mening kabinetim</a>`;
                    }
                    navSection.innerHTML = `
                        <div class="flex items-center gap-2">
                            <a href="${user.role === 'admin' ? '/admin' : '/profile'}" class="flex items-center gap-2 group">
                                <img src="${user.avatar_url || '/static/default-avatar.png'}" alt="Avatar" class="w-8 h-8 rounded-full object-cover border-2 border-blue-500 shadow-sm" onerror="this.src='/static/default-avatar.png'">
                                <span class="font-bold text-sm text-gray-800 dark:text-gray-100 group-hover:text-blue-600 transition">${user.name}</span>
                            </a>
                            ${navLink}
                        </div>
                        <button onclick="logout()" class="text-red-500 hover:text-red-700 text-xs font-semibold ml-2" data-i18n="nav.logout">Chiqish</button>
                    `;
                    setLanguage(getLanguage());
                }
            } catch (e) {
                console.error(e);
            }
        }

        function logout() {
            removeToken();
            document.cookie = "access_token=; path=/; max-age=0";
            window.location.href = '/login';
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateThemeIcon();
            updateNavbar();
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
