{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-sm border border-gray-100">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                Tizimga kiring
            </h2>
        </div>
        
        <div id="errorBox" class="hidden bg-red-50 border-l-4 border-red-500 p-4">
            <p class="text-sm text-red-700" id="errorMsg"></p>
        </div>

        <form id="loginForm" class="mt-8 space-y-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Elektron pochta</label>
                    <input id="email" type="email" required class="mt-1 w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Parol</label>
                    <input id="password" type="password" required class="mt-1 w-full border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
            </div>

            <div>
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none">
                    Kirish
                </button>
            </div>
            
            <div class="text-sm text-center">
                Akkauntingiz yo'qmi? <a href="/register" class="font-medium text-blue-600 hover:text-blue-500">Ro'yxatdan o'tish</a>
            </div>
        </form>

        <div class="mt-6 bg-blue-50 rounded-lg p-4 text-sm text-blue-700">
            <p class="font-bold mb-1">Demo Akkauntlar:</p>
            <p>Admin: admin@falcon.uz / admin123</p>
            <p>Mijoz: mijoz1@falcon.uz / mijoz123</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const params = new URLSearchParams();
        params.append('username', document.getElementById('email').value);
        params.append('password', document.getElementById('password').value);

        try {
            const res = await fetch(`${API_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            });
            const data = await res.json();
            
            if (res.ok) {
                setToken(data.access_token);
                // Check next
                const urlParams = new URLSearchParams(window.location.search);
                const next = urlParams.get('next');
                
                // Get User role to redirect properly if no next
                const userRes = await fetchWithAuth(`${API_URL}/auth/me`);
                const userData = await userRes.json();
                
                if(next) {
                    window.location.href = next;
                } else if(userData.role === 'admin') {
                    window.location.href = '/admin';
                } else {
                    window.location.href = '/profile';
                }
            } else {
                const box = document.getElementById('errorBox');
                box.classList.remove('hidden');
                document.getElementById('errorMsg').innerText = data.detail || "Email yoki parol noto'g'ri";
            }
        } catch (e) {
            console.error(e);
        }
    }
</script>
{% endblock %}
